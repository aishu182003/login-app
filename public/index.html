<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — User Registry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <!-- FORM -->
    <section class="panel form-panel">
      <div class="eyebrow">Create account</div>
      <h1>Join the registry</h1>
      <p class="sub">Enter your name, birthday and a password. Your record is saved and shown as a card below.</p>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Ada Lovelace" required minlength="2">
          <span class="error" id="nameError"></span>
        </div>

        <div class="field">
          <label for="birthday">Birthday</label>
          <input type="date" id="birthday" name="birthday" required>
          <span class="error" id="birthdayError"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
          <span class="error" id="passwordError"></span>
        </div>

        <button type="submit" id="submitBtn">Save &amp; add card</button>
        <div class="form-status" id="formStatus" role="status"></div>
      </form>
    </section>

    <!-- CARDS -->
    <section class="panel cards-panel">
      <div class="cards-header">
        <h2>Registered users</h2>
        <span class="count" id="userCount">0</span>
      </div>
      <div id="cardsGrid" class="cards-grid">
        <p class="empty" id="emptyState">No one has signed up yet. Fill the form to add the first card.</p>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
